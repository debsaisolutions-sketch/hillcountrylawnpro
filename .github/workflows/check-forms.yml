name: Check lead forms

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject placeholder forms and missing local assets
        run: python3 scripts/check_lead_forms.py
      - name: Lead form test with mocked fetch
        run: node scripts/test-tdp-leads.mjs
